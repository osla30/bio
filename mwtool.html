    function updateLanguage() {

        // 重新渲染表格與計數文字以套用語言
        renderTable(currentDisplayData);

        currentLang = currentLang === 'tw' ? 'en' : 'tw';

    // --- 計算器邏輯 (支援下標與水合物) ---
    const atomicWeights = {
        H: 1.008, He: 4.0026, Li: 6.94, Be: 9.0122, B: 10.81, C: 12.011, N: 14.007, O: 15.999,
        F: 18.998, Ne: 20.180, Na: 22.990, Mg: 24.305, Al: 26.982, Si: 28.085, P: 30.974,
        S: 32.06, Cl: 35.45, K: 39.098, Ar: 39.95, Ca: 40.078, Fe: 55.845, Cu: 63.546,
        Zn: 65.38, Br: 79.904, Ag: 107.87, I: 126.90, Ba: 137.33, Au: 196.97, Hg: 200.59, Pb: 207.2
    };

    function normalizeSubscripts(str) {
        const subscriptMap = {
            '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4',
            '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9'
        };
        // 額外過濾掉化學式內部的所有空白字元與常見電荷符號，避免解析錯誤
        return str.replace(/[₀-₉]/g, match => subscriptMap[match]).replace(/\s+/g, '').replace(/[\+\-]/g, ''); 
    }

    function parseGroup(formula) {
        if (!formula) return {}; // 防呆：避免空字串
        let stack = [{}];
        let i = 0;
        while (i < formula.length) {
            let char = formula[i];
            if (char === '(' || char === '[') {
                stack.push({});
                i++;
            } else if (char === ')' || char === ']') {
                if (stack.length === 1) throw new Error(dict[currentLang].errParse); // 括號不對稱
                let counts = stack.pop();
                i++;
                let num = "";
                while (i < formula.length && /[0-9.]/.test(formula[i])) {
                    num += formula[i];
                    i++;
                }
                num = num === "" ? 1 : parseFloat(num);
                let top = stack[stack.length - 1];
                for (let [el, count] of Object.entries(counts)) {
                    top[el] = (top[el] || 0) + count * num;
                }
            } else if (/[A-Z]/.test(char)) {
                let el = char;
                i++;
                while (i < formula.length && /[a-z]/.test(formula[i])) {
                    el += formula[i];
                    i++;
                }
                let num = "";
                while (i < formula.length && /[0-9.]/.test(formula[i])) {
                    num += formula[i];
                    i++;
                }
                num = num === "" ? 1 : parseFloat(num);
                let top = stack[stack.length - 1];
                top[el] = (top[el] || 0) + num;
            } else {
                if (char === 'n') {
                     throw new Error(`${dict[currentLang].errPolymer}"${char}"`);
                } else {
                     throw new Error(`${dict[currentLang].errParse}: 無法識別字元 "${char}"`);
                }
            }
        }
        if (stack.length !== 1) throw new Error(dict[currentLang].errParse); // 括號不對稱
        return stack[0];
    }

    function calculateMolecularWeight(rawInput) {
        // 先將字串根據中點或星號分割 (移除了 + 號分割，因為 + 號通常是電荷)
        let parts = rawInput.split(/·|\*/);
        let totalWeight = 0;
        
        for (let part of parts) {
            part = part.trim();
            if (!part) continue;
            // 進行下標轉換與去空白
            part = normalizeSubscripts(part); 
            
            // 捕捉前置係數
            let match = part.match(/^([0-9\.]+)(.*)/);
            let multiplier = 1;
            let formula = part;
            
            if (match) {
                multiplier = parseFloat(match[1]);
                formula = match[2];
                if (!formula) continue; // 如果只有數字，略過
            }
            
            let counts = parseGroup(formula);
            let partWeight = 0;
            for (let [el, count] of Object.entries(counts)) {
                if (atomicWeights[el] !== undefined) {
                    partWeight += atomicWeights[el] * count;
                } else {
                    throw new Error(`${dict[currentLang].errElement}${el}`);
                }
            }
            totalWeight += partWeight * multiplier;
        }
        return totalWeight;
    }

    function calculate() {
        const input = document.getElementById('formula').value;
        const errorMsg = document.getElementById('error-msg');
        const resultBox = document.getElementById('result-box');
        const resultValue = document.getElementById('result-value');
        
        errorMsg.textContent = "";
        resultBox.style.display = "none";
        
        if (!input.trim()) {
            errorMsg.textContent = dict[currentLang].errEmpty;
            return;
        }
        try {
            const mw = calculateMolecularWeight(input);
            if (mw === 0) throw new Error(dict[currentLang].errParse);
            resultValue.textContent = mw.toFixed(2);
            resultBox.style.display = "block";
        } catch (e) {
            errorMsg.textContent = e.message;
        }
    }

    document.getElementById('formula').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') calculate();
    });

    const dataCount = document.getElementById('dataCount');
    const exportBtn = document.getElementById('exportBtn');

    function renderTable(data) {
        currentDisplayData = data;
        tableBody.innerHTML = '';
        
        let textCount = dict[currentLang].dataCount.replace('{n}', data.length);
        dataCount.innerText = textCount;
        
        if (data.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 30px; color:#7f8c8d;">${dict[currentLang].noData}</td></tr>`;
            return;
        }
        data.forEach(chem => {
            const row = document.createElement('tr');
            let mwDisplay = chem.mw.toFixed(2);
            if (chem.common.includes("Triton") || chem.common.includes("Tween") || chem.common.includes("NP-40") || chem.common.includes("PFA")) {
                mwDisplay = `~${mwDisplay} (Avg/Monomer)`;
            }
            row.innerHTML = `
                <td><strong>${chem.common}</strong></td>
                <td style="font-size: 0.9em; color: #555;">${chem.iupac}</td>
                <td>${chem.formula}</td>
                <td class="mw-value">${mwDisplay}</td>
                <td class="cas-value">${chem.cas}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    renderTable(chemicalData);

    searchInput.addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase();
        const filteredData = chemicalData.filter(chem => 
            chem.common.toLowerCase().includes(searchTerm) || 
            chem.iupac.toLowerCase().includes(searchTerm) ||
            chem.formula.toLowerCase().includes(searchTerm) ||
            chem.cas.toLowerCase().includes(searchTerm)
        );
        renderTable(filteredData);
    });

    });
